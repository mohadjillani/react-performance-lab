name: compare

# Measures every branch in scripts/branches.json on identical runners, merges
# the results, and opens a pull request with the regenerated docs/results.md
# (and the README's results block). Runs on demand and weekly so the table
# cannot go stale relative to the branches.
#
# A pull request rather than a push to main, for two reasons.
#
# `main` is protected and should stay protected: a bot with permission to push
# past required checks is a hole in the review those checks exist to enforce,
# and it is a hole that only ever gets used by accident.
#
# And these are wall-clock measurements from a shared runner, so they move a
# little every week whatever the code does. The drift-check-and-fail pattern
# used elsewhere in this portfolio would fail every Monday and be ignored by
# the second week. A pull request puts the new numbers in front of a person,
# which is what a benchmark refresh actually wants.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.read.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "branches=$(jq -c . scripts/branches.json)" >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Slug for artifact and file names
        id: slug
        env:
          BRANCH: ${{ matrix.branch }}
        run: echo "value=${BRANCH//[^A-Za-z0-9.-]/-}" >> "$GITHUB_OUTPUT"
      - name: Measure ${{ matrix.branch }}
        run: npm run measure -- --label "${{ matrix.branch }}" --no-gate --out ".measurements/${{ steps.slug.outputs.value }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-${{ steps.slug.outputs.value }}
          path: |
            .measurements/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error

  merge:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: measurement-*
          path: .
          merge-multiple: true
      - name: Render docs/results.md
        run: npm run compare -- --render-only --environment "GitHub Actions, ubuntu-latest, run ${{ github.run_number }}"
      - name: Open a pull request with the regenerated table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/results-refresh
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/results.md README.md
          if git diff --cached --quiet; then
            echo "results unchanged — nothing to open a pull request for"
            exit 0
          fi

          git commit -m "docs: regenerate results table from compare run ${RUN}"

          # One long-lived branch, force-updated each week. A branch per run
          # would leave a pile of stale ones nobody closes.
          git push --force origin "HEAD:${BRANCH}"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "existing pull request updated in place"
            exit 0
          fi

          # Written to a file rather than passed inline, so the body does not
          # carry this block's YAML indentation into the pull request.
          cat > /tmp/pr-body.md <<BODY
          Regenerated by the weekly \`compare\` workflow (run ${RUN}), from measurements taken on identical GitHub Actions runners.

          These numbers move a little from run to run — they are wall-clock measurements on a shared machine. Read the diff for a **change in the story** rather than a change in the digits: a fix that has stopped helping, or a regression that has turned a saving into a cost.

          If the story is unchanged, merging keeps the table honest about where its numbers came from.
          BODY
          sed -i 's/^          //' /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: refresh the measured results table" \
            --body-file /tmp/pr-body.md
