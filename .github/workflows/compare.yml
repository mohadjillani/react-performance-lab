name: compare

# Measures every branch in scripts/branches.json on identical runners, merges
# the results, and **reports** the regenerated table. Runs on demand and weekly,
# so drift between the committed numbers and the branches is visible.
#
# It does not commit anything, and that took two attempts to get right.
#
# Pushing straight to `main` fails: the branch is protected, and a bot that
# could push past required checks would be a hole in the review those checks
# exist to enforce.
#
# Opening a pull request fails less obviously. GitHub deliberately does not
# trigger workflows for a pull request created with `GITHUB_TOKEN`, so the
# required checks never run and the pull request sits permanently unmergeable.
# A weekly job that produces an un-mergeable pull request is worse than no job.
#
# So the run reports instead. The numbers land in the job summary and in an
# artifact; refreshing the committed table is `npm run compare` locally, then a
# commit that goes through review like any other. The table stays something a
# person put there on purpose, and the README says which run it came from.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.read.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "branches=$(jq -c . scripts/branches.json)" >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Slug for artifact and file names
        id: slug
        env:
          BRANCH: ${{ matrix.branch }}
        run: echo "value=${BRANCH//[^A-Za-z0-9.-]/-}" >> "$GITHUB_OUTPUT"
      - name: Measure ${{ matrix.branch }}
        run: npm run measure -- --label "${{ matrix.branch }}" --no-gate --out ".measurements/${{ steps.slug.outputs.value }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-${{ steps.slug.outputs.value }}
          path: |
            .measurements/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error

  merge:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: measurement-*
          path: .
          merge-multiple: true
      - name: Render docs/results.md
        run: npm run compare -- --render-only --environment "GitHub Actions, ubuntu-latest, run ${{ github.run_number }}"
      - name: Report the regenerated table
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail

          {
            echo "## Measured results — run ${RUN}"
            echo
            echo "Measured on GitHub Actions runners. To adopt these numbers, run"
            echo '`npm run compare` locally and commit the result.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- docs/results.md README.md; then
            echo "The committed table still matches these measurements." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### The committed table differs from this run"
              echo
              echo "Wall-clock measurements move between runs on a shared machine."
              echo "Look for a change in the **story** — a fix that has stopped"
              echo "helping, or a regression that turned a saving into a cost —"
              echo "rather than a change in the digits."
              echo
              echo '```diff'
              git --no-pager diff -- docs/results.md README.md | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the regenerated table
        uses: actions/upload-artifact@v4
        with:
          name: results-run-${{ github.run_number }}
          path: |
            docs/results.md
            README.md
          if-no-files-found: error
